<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Amigos da Suzanne</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      .a-enter-vr,
      .a-enter-vr-button,
      .a-enter-ar,
      .a-enter-ar-button {
        display: none !important;
      }
    </style>
  </head>

  <body style="margin: 0px; overflow: hidden">
    <a-scene embedded arjs="debugUIEnabled: false">

      <a-assets>
        <video id="video-suzanne" src="VIDEO100010500.mp4"
               loop muted autoplay playsinline webkit-playsinline preload="auto"></video>
      </a-assets>

      <a-marker type="pattern" url="pattern-marcadorSuzanne.patt">
        <a-video src="#video-suzanne" rotation="-90 0 0" width="1" height="1"></a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
